<!DOCTYPE html>
<html>
<head>
  <title>WhatsApp WAHA Local QR</title>
  <style>
    body { font-family: sans-serif; text-align: center; margin-top: 50px; background: #f0f2f5; }
    .card { background: white; padding: 30px; border-radius: 10px; display: inline-block; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
    img { max-width: 300px; border: 2px solid #ddd; padding: 10px; border-radius: 10px; margin-top: 20px;}
    button { background: #25D366; color: white; border: none; padding: 10px 20px; font-size: 16px; border-radius: 5px; cursor: pointer; }
    button:hover { background: #1ebe5d; }
  </style>
</head>
<body>
  <div class="card">
    <h2>Scan to Link Local WAHA</h2>
    <p>1. Open WhatsApp on your phone.<br>2. Tap Menu or Settings and select Linked Devices.<br>3. Point your phone to this screen.</p>
    <button onclick="fetchQR()">Load QR Code</button>
    <br>
    <img id="qr-img" style="display:none;" />
    <p id="status"></p>
  </div>

  <script>
    let pollInterval = null;

    async function checkStatus() {
      try {
        const res = await fetch('http://localhost:3000/api/sessions?all=true', {
          headers: { 'X-Api-Key': 'CHANGE_ME_waha_api_key_here' }
        });
        if (res.ok) {
          const sessions = await res.json();
          const session = sessions.find(s => s.name === 'fashion-gallery');
          if (session) {
            if (session.status === 'WORKING') {
              document.getElementById('status').innerHTML = '<b style="color:green;">✅ WhatsApp Connected & Logged In! Session is Saved.</b>';
              document.getElementById('qr-img').style.display = 'none';
              if (pollInterval) clearInterval(pollInterval);
              return true;
            }
          }
        }
      } catch (e) {}
      return false;
    }

    async function fetchQR() {
      const status = document.getElementById('status');
      const img = document.getElementById('qr-img');
      status.innerText = "Fetching QR code from WAHA...";
      
      const isConnected = await checkStatus();
      if (isConnected) return;

      try {
        const response = await fetch('http://localhost:3000/api/fashion-gallery/auth/qr?t=' + Date.now(), {
          headers: { 'X-Api-Key': 'CHANGE_ME_waha_api_key_here' }
        });
        
        if (response.ok) {
          const blob = await response.blob();
          img.src = URL.createObjectURL(blob);
          img.style.display = "inline-block";
          status.innerHTML = "<b>QR Loaded! Scan it with WhatsApp (Linked Devices).</b><br>Auto-refreshing every 6 seconds...";
        } else {
          status.innerText = "WAHA status: " + response.status + ".";
        }
      } catch (e) {
        status.innerText = "Failed to connect to localhost:3000. Is WAHA running?";
      }
    }

    // Auto-load QR on open and poll
    fetchQR();
    pollInterval = setInterval(fetchQR, 6000);
  </script>
</body>
</html>
